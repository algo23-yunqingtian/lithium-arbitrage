name: daily-snapshot

on:
  schedule:
    # 北京时间 15:30（07:30 UTC）工作日 —— 期货日盘 15:00 收盘后抓当日快照
    - cron: '30 7 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch daily snapshot
        run: node snapshot_daily.mjs
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          if git diff --cached --quiet; then
            echo "no data change"
          else
            git commit -m "data: 每日快照 $(date -u +%F)"
            git push
          fi
